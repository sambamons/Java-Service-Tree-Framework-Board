<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('자유게시판')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
    <div class="page-head">
        <h1>자유게시판</h1>
        <p th:if="${loginMember != null}"><a th:href="@{/board/write}" class="btn btn-primary">글쓰기</a></p>
    </div>
    <form th:action="@{/board}" method="get" class="search">
        <select name="type">
            <option value="title" th:selected="${type == 'title'}">제목</option>
            <option value="content" th:selected="${type == 'content'}">내용</option>
            <option value="writer" th:selected="${type == 'writer'}">작성자</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="검색어">
        <select name="sort">
            <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
            <option value="oldest" th:selected="${sort == 'oldest'}">오래된순</option>
        </select>
        <button type="submit" class="btn btn-primary">검색</button>
    </form>

    <div class="card table-wrap">
    <table class="table-stack">
        <thead>
        <tr><th class="col-num">번호</th><th>제목</th><th>작성자</th><th>작성일</th></tr>
        </thead>
        <tbody>
        <tr th:if="${posts.isEmpty()}">
            <td colspan="4" class="empty">게시글이 없습니다.</td>
        </tr>
        <tr th:each="post : ${posts}">
            <td class="col-num" data-label="번호" th:text="${post.id}">1</td>
            <td class="cell-title"><a th:href="@{/board/{id}(id=${post.id})}" th:text="${post.title}">제목</a></td>
            <td data-label="작성자" th:text="${post.writerName}">작성자</td>
            <td data-label="작성일" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
        </tr>
        </tbody>
    </table>
    </div>

    <nav class="pages" aria-label="페이지 이동" th:if="${totalPages > 1}">
        <a th:if="${pageBlock.firstPage}" class="disabled" role="link" aria-disabled="true" aria-label="처음 페이지">&laquo;</a>
        <a th:unless="${pageBlock.firstPage}"
           th:href="@{/board(page=1, sort=${sort}, type=${type}, keyword=${keyword})}"
           aria-label="처음 페이지">&laquo;</a>
        <a th:if="${pageBlock.firstPage}" class="disabled" role="link" aria-disabled="true" aria-label="이전 페이지">&lsaquo;</a>
        <a th:unless="${pageBlock.firstPage}"
           th:href="@{/board(page=${pageBlock.prevPage}, sort=${sort}, type=${type}, keyword=${keyword})}"
           aria-label="이전 페이지">&lsaquo;</a>
        <a th:each="p : ${#numbers.sequence(pageBlock.start, pageBlock.end)}"
           th:href="@{/board(page=${p}, sort=${sort}, type=${type}, keyword=${keyword})}"
           th:text="${p}" th:classappend="${p == page} ? 'current'"
           th:attr="aria-current=${p == page} ? 'page'">1</a>
        <a th:if="${pageBlock.lastPage}" class="disabled" role="link" aria-disabled="true" aria-label="다음 페이지">&rsaquo;</a>
        <a th:unless="${pageBlock.lastPage}"
           th:href="@{/board(page=${pageBlock.nextPage}, sort=${sort}, type=${type}, keyword=${keyword})}"
           aria-label="다음 페이지">&rsaquo;</a>
        <a th:if="${pageBlock.lastPage}" class="disabled" role="link" aria-disabled="true" aria-label="마지막 페이지">&raquo;</a>
        <a th:unless="${pageBlock.lastPage}"
           th:href="@{/board(page=${pageBlock.last}, sort=${sort}, type=${type}, keyword=${keyword})}"
           aria-label="마지막 페이지">&raquo;</a>
    </nav>
</main>
</body>
</html>
