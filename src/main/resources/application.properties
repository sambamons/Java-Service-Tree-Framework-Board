# 기본 실행은 내장 DB(H2 파일 모드)다. 데이터는 홈 폴더의 .board-h2/ 에 남는다.
# 운영 MySQL 은 mysql 프로필로 실행한다(application-mysql.properties).
spring.datasource.url=jdbc:h2:file:~/.board-h2/board;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
